[server]
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#d1d5db"
linkColor = "#0f766e"
redColor = "#dc2626"
greenColor = "#15803d"
orangeColor = "#d97706"
blueColor = "#0f766e"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"
dataframeHeaderBackgroundColor = "#111827"
dataframeHeaderTextColor = "#f9fafb"
dataframeBorderColor = "#d1d5db"

[theme.sidebar]
backgroundColor = "#111827"
secondaryBackgroundColor = "#1f2937"
textColor = "#f3f4f6"
borderColor = "#374151"
primaryColor = "#14b8a6"
linkColor = "#5eead4"
codeBackgroundColor = "#1f2937"
codeTextColor = "#e5e7eb"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.5rem"
