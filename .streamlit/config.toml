[server]
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false

[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#1d4ed8"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#cbd5e1"
linkColor = "#2563eb"
redColor = "#dc2626"
greenColor = "#15803d"
orangeColor = "#d97706"
blueColor = "#2563eb"
dataframeHeaderBackgroundColor = "#0f172a"
dataframeHeaderTextColor = "#f8fafc"
dataframeBorderColor = "#cbd5e1"

[theme.light.sidebar]
backgroundColor = "#e8eef6"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#cbd5e1"
primaryColor = "#1d4ed8"
linkColor = "#2563eb"
codeBackgroundColor = "#ffffff"
codeTextColor = "#0f172a"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.dark]
primaryColor = "#2563eb"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
borderColor = "#1f2937"
linkColor = "#60a5fa"
redColor = "#ef4444"
greenColor = "#22c55e"
orangeColor = "#f59e0b"
blueColor = "#3b82f6"
dataframeHeaderBackgroundColor = "#1e293b"
dataframeHeaderTextColor = "#f8fafc"
dataframeBorderColor = "#334155"

[theme.dark.sidebar]
backgroundColor = "#080d19"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
borderColor = "#1e293b"
primaryColor = "#3b82f6"
linkColor = "#60a5fa"
codeBackgroundColor = "#111827"
codeTextColor = "#e2e8f0"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.5rem"
