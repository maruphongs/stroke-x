[server]
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0369a1"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#cbd5e1"
linkColor = "#0284c7"
redColor = "#dc2626"
greenColor = "#16a34a"
orangeColor = "#d97706"
blueColor = "#0284c7"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"
dataframeHeaderBackgroundColor = "#0f172a"
dataframeHeaderTextColor = "#f8fafc"
dataframeBorderColor = "#cbd5e1"

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
borderColor = "#334155"
primaryColor = "#38bdf8"
linkColor = "#7dd3fc"
codeBackgroundColor = "#1e293b"
codeTextColor = "#e2e8f0"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.5rem"
